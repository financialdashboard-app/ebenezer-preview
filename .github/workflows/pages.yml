name: Publish preview to gh-pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build site (decode binary assets)
        run: |
          mkdir -p /tmp/site
          rsync -a --exclude '.git' --exclude '.github' ./ /tmp/site/
          cd /tmp/site
          find . -name '*.b64' | while read f; do base64 -d "$f" > "${f%.b64}"; rm "$f"; done
          touch .nojekyll
      - name: Push to gh-pages
        run: |
          cd /tmp/site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish preview from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
